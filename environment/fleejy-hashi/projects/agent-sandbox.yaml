agent-sandbox:
  name: agent-sandbox
  project_team_access:
    team-A: {}
    team-human:
      # Sets project-level permissions for team-human.
      state_versions: write          # none | read-outputs | read-all | read-all-encrypted
      sentinel_mocks: read           # none | read
      runs: apply                    # read | plan | apply
      variables: read                # none | read | read-and-write
      create: true
      locking: true
      move: false
      delete: false
      run_tasks: false
  project_variable_set:
    arguments:
      global: false
      priority: true